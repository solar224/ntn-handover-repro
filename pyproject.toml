[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntn-handover-repro"
version = "0.1.0"
description = "Result-level reproduction package for Hybrid Model-Aided Learning for 5G-NTN Handover."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "torch>=2.3",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "skyfield>=1.49",
  "sgp4>=2.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

